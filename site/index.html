<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Otterly proxy</title>
<style>
  body { font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #374151; background: #f6f7f9; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .box { max-width: 420px; padding: 28px 32px; background: #fff; border: 1px solid #e3e6ea;
    border-radius: 12px; text-align: center; }
  code { background: #eef0f3; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="box">
    <p>This is an API proxy endpoint, not a website.</p>
    <p>It only serves requests under <code>/api/</code>.</p>
  </div>
</body>
</html>
